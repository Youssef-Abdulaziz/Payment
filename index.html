<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Payment</title>
  </head>
  <body>
    <header></header>
    <main>
      <section class="payment">
        <div class="card settings-card shadow-lg p-4 p-md-5 mx-5">
          <h1 class="text-center fw-bold mb-1">Settings</h1>
          <p class="text-center text-muted mb-4">Payment</p>

          <!--Sav-->
          <h6 class="fw-bold mb-3">Saved cards:</h6>

          <div class="d-flex align-items-center mb-3">
            <div class="card-brand mastercard me-3">
              <i
                class="fa-brands fa-cc-mastercard"
                style="color: rgb(0, 0, 0)"
              ></i>
            </div>
            <div class="form-floating flex-grow-1">
              <input
                type="text"
                class="form-control"
                id="card1"
                value="**** **** **** 3193"
                disabled
              />
              <label for="card1">Card Number</label>
            </div>
            <a href="#" class="ms-3 remove-link text-decoration-none"
              >Remove card</a
            >
          </div>

          <div class="d-flex align-items-center mb-4">
            <div class="card-brand visa me-3">
              <i class="fa-brands fa-cc-visa" style="color: rgb(0, 0, 0)"></i>
            </div>
            <div class="form-floating flex-grow-1">
              <input
                type="text"
                class="form-control"
                id="card2"
                value="**** **** **** 4296"
                disabled
              />
              <label for="card2">Card Number</label>
            </div>
            <a href="#" class="ms-3 remove-link text-decoration-none"
              >Remove card</a
            >
          </div>

          <!-- SECTION 2-->
          <h6 class="fw-bold mb-3">Add new card:</h6>

          <form>
            <div class="form-floating mb-3">
              <input
                type="text"
                class="form-control"
                id="cardholderName"
                placeholder=" "
                value="Heba Kasasbeh"
              />
              <label for="cardholderName">Cardholder's Name</label>
            </div>

            <div class="row g-2 mb-4">
              <div class="col-12 col-sm-6">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="cardNumber"
                    placeholder="1234 5678 1234 5678"
                  />
                  <label for="cardNumber">Card Number</label>
                </div>
              </div>
              <div class="col-6 col-sm-3">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="expire"
                    placeholder="MM/YY"
                  />
                  <label for="expire">Expire</label>
                </div>
              </div>
              <div class="col-6 col-sm-3">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="cvv"
                    placeholder="***"
                    maxlength="4"
                  />
                  <label for="cvv">Cvv</label>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 btn-add-card">
              ADD CARD
            </button>
          </form>
        </div>
      </section>
    </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
